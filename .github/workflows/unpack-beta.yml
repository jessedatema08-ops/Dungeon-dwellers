name: Unpack full beta
on:
  push:
    branches: [main]
    paths:
      - 'dungeon-dwellers-full-beta.zip'
      - '.github/workflows/unpack-beta.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack beta into repository root
        run: |
          unzip -o dungeon-dwellers-full-beta.zip -d .
          rm -f dungeon-dwellers-full-beta.zip
      - name: Commit unpacked PWA
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Unpack Dungeon Dwellers full beta PWA'
          git push
